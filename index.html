<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo Engine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(ellipse at 50% 0%, #0b1230 0%, #04060f 45%, #000000 100%) fixed;
      color: #e6e9f5;
    }

    /* Sparkles + meteors background */
    #sparkles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .container {
      position: relative;
      z-index: 1;
    }

    .app-title {
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #e8eaf8;
    }
    .glass {
      background: rgba(255, 255, 255, .025);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 1.5rem;
      box-shadow: none;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    .section-label {
      font-size: 1rem;
      font-weight: 500;
      color: #b9bfd8;
      margin-bottom: .6rem;
    }
    .section-title {
      font-weight: 800;
      letter-spacing: .04em;
      color: #d9dcee;
    }
    #todo-input {
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .1);
      color: #fff;
      border-radius: 1rem !important;
      padding: .8rem 1rem;
      font-size: 1.1rem;
    }
    #todo-input::placeholder { color: #7d84a3; }
    #todo-input:focus {
      box-shadow: 0 0 0 .2rem rgba(110, 140, 255, .25);
      border-color: rgba(110, 140, 255, .6);
    }
    .btn-add {
      background: linear-gradient(160deg, #2b3a63, #1b2543);
      border: 1px solid rgba(255, 255, 255, .15);
      color: #fff;
      font-weight: 700;
      border-radius: 1rem !important;
      padding: .8rem 1.4rem;
    }
    .btn-add:hover { background: linear-gradient(160deg, #36497d, #223059); color: #fff; }
    #todo-stats { font-weight: 700; color: #c9cee6; }
    .task-row {
      background: rgba(255, 255, 255, .03);
      border: 1px solid rgba(255, 255, 255, .08) !important;
      border-radius: 1.1rem !important;
      color: #eef0fa;
      padding: 1rem 1.1rem;
      margin-bottom: .8rem;
    }
    .task-text { font-size: 1.2rem; }
    .task-row.done .task-text { text-decoration: line-through; opacity: .5; }
    .task-time { color: #8189a8; font-size: .8rem; }
    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: .8rem;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .14);
      color: #fff;
      font-weight: 800;
      font-size: 1.1rem;
      line-height: 1;
    }
    .icon-btn:hover { background: rgba(60, 75, 130, .6); color: #fff; }
    .icon-btn.active { background: #2f7d5b; border-color: #46b283; }
    #empty-message { color: #8189a8 !important; }
    #todo-count { color: #9aa2c4 !important; }
    #clear-completed { border-radius: .8rem; }
  </style>
</head>
<body class="min-vh-100">

  <canvas id="sparkles" aria-hidden="true"></canvas>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-9 col-lg-7">

        <h1 class="app-title display-5 mb-4">Todo Engine</h1>

        <!-- New task card -->
        <div class="glass p-4 mb-4">
          <div class="section-label">New task</div>
          <form id="todo-form" class="d-flex gap-2 mb-3">
            <input type="text" id="todo-input" class="form-control" placeholder="Type a task..." aria-label="New task" required>
            <button type="submit" class="btn btn-add">Add</button>
          </form>
          <div id="todo-stats" class="fs-5">Total: 0 | Done: 0 | Left: 0</div>
        </div>

        <!-- Tasks card -->
        <div class="glass p-4">
          <h2 class="section-title h4 mb-3">TASKS</h2>

          <ul id="todo-list" class="list-unstyled mb-3"></ul>

          <p id="empty-message" class="text-center mb-3">No tasks yet. Add one above.</p>

          <div class="d-flex justify-content-between align-items-center">
            <small id="todo-count">0 tasks left</small>
            <button id="clear-completed" class="btn btn-outline-danger btn-sm">Clear completed</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="to-do.js"></script>
</body>
</html>
