<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="min-vh-100" style="background-color: #FFE5D4;">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="h3 card-title text-center mb-4">To-Do List</h1>

            <form id="todo-form" class="d-flex gap-2 mb-3">
                <input type="text" id="todo-input" class="form-control rounded-pill px-3" placeholder="Add a new task" aria-label="New task" required>
                <button type="submit" class="btn btn-primary rounded-pill px-4">Add</button>
            </form>

            <ul id="todo-list" class="list-group mb-3"></ul>

            <p id="empty-message" class="text-center text-body-secondary mb-3">No tasks yet. Add one above.</p>

            <div class="d-flex justify-content-between align-items-center">
              <small id="todo-count" class="text-body-secondary">0 tasks left</small>
              <button id="clear-completed" class="btn btn-outline-danger btn-sm">Clear completed</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="to-do.js"></script>
</body>
</html>
